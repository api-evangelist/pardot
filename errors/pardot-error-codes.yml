  message: One or more of the specified fields are invalid
  problem: One or more of the fields in the CSV is not a recognized standard or custom field.
  solution: Ensure all of the column headers in the CSV match the headers in the field reference. Ensure
    the number of columns in the CSV matches the number of columns in the header row.
- code: '131'
  message: Your account is locked due to too many failed login attempts. Reset your password at <https://pi.pardot.com/user/passwordReset>
  problem: Too many invalid api requests have been made.
  solution: Reset your password at <https://pi.pardot.com/user/passwordReset>
- code: '132'
  message: Prospect is archived
  problem: The prospect is in the recycle bin and can't be read.
  solution: Undelete the prospect via the UI or choose another prospect.
- code: '133'
  message: Up to 2 sort by options are allowed.
  problem: Too many columns were passed into the sort parameter.
  solution: Use 2 or fewer sort by columns.
- code: '134'
  message: Up to 2 sort order options are allowed.
  problem: Too many orders were passed into the sort parameter.
  solution: Use 2 or fewer sort orders.
- code: '135'
  message: When passing a comma-separated value, one of the two values must be id.
  problem: When sorting by multiple columns, one column must be the ID column.
  solution: Add the ID column to the request.
- code: '137'
  message: URL is not valid. Please include a protocol (e.g., http\:// or https\:// )
  problem: An invalid URL was supplied in the request.
  solution: Add one of the requested protocols to the request.
- code: '138'
  message: The supplied name contains too many characters.
  problem: The name supplied was too long.
  solution: Reduce the length of the name field.
- code: '139'
  message: The supplied name is not valid.
  problem: The name field has an invalid character.
  solution: Remove special characters from the name field.
- code: '145'
  message: Invalid archived parameter specified. Allowed values are true or false.
  problem: The archived parameter only accepts boolean values.
  solution: Update the request to send the proper boolean value.
- code: '146'
  message: Invalid archived parameter specified. Allowed values are true or false.
  problem: The archived parameter only accepts boolean values.
  solution: Update the request to send the proper boolean value.
- code: '150'
  message: Input needs to be valid JSON
  problem: The JSON that was submitted was invalid.
  solution: Submit valid JSON. A JSON linter may help ensure that the payload is valid before sending.
- code: '151'
  message: Unsupported content-type
  problem: The 'Content-Type' header has an unsupported value for this endpoint.
  solution: Check the documentation for the specific endpoint and ensure you are sending the correct Content
    Type value.
- code: '152'
  message: Request body can't be empty
  problem: The API request has no body.
  solution: Ensure that the payload of the request is being sent and is encoded as 'application/json'
- code: '153'
  message: Missing required property in request
  problem: A required field in the request body could not be found.
  solution: Check the documentation and ensure that all required fields in the request body are specified.
- code: '154'
  message: Invalid property in request
  problem: A field in the request body has an invalid value.
  solution: Check the documentation and ensure that the value that is being passed is supported. Several
    values are not supported at this time.
- code: '155'
  message: Can't update. Import must be in "Open" state.
  problem: The import that is trying to be updated is not in the “Open” state.
  solution: This import is no longer eligible to receive updates. Create an import, or update an existing
    import in the “Open” state.
- code: '156'
  message: Can't start processing. Import has no associated data.
  problem: The import that is trying to be set to “Ready” has no data associated with it.
  solution: Upload a batch of data before setting the import to “Ready”.
- code: '157'
  message: Error processing import request. Please contact your Account Engagement support representative
  problem: The import has no background processing agent associated with it.
  solution: This import was improperly created and is unsalvageable. Create an import and upload the same
    batch of data to ensure processing occurs.
- code: '158'
  message: Uploading a file was unsuccessful
  problem: The “files” element of the request body could not be found.
  solution: Ensure that the CSV being uploaded belongs to a key named “files”.
- code: '159'
  message: The file is not in a valid CSV format
  problem: The CSV file is invalid.
  solution: Ensure that the CSV file is properly formatted. There must be 1 header row, at least 1 data
    row, and the number of columns in each row must match the number of columns in the header.
- code: '160'
  message: The limit of batches per import has been reached
  problem: Too many batches have been submitted for this import
  solution: Create an import to submit this batch, or submit this batch to an import that has batch capacity.
- code: '161'
  message: The current state of the import does not allow the operation
  problem: A batch was submitted to an import that is not “Open”
  solution: Create an import to submit this batch, or submit this batch to an import that is “Open”. Processing
    is not affected for the import associated with the failed request.
- code: '162'
  message: No file was specified or uploaded
  problem: No CSV file was submitted
  solution: Submit a CSV file in the body of the request under the “files” key.
- code: '163'
  message: Too many files were specified or uploaded
  problem: 'Problem: More than 1 file was submitted in a single request'
  solution: Submit only 1 file per request.
- code: '164'
  message: Daily limit of import batches has been reached
  problem: Too many batches have been submitted over a 24-hour period. The account limit has been reached.
  solution: Wait and try again later.
- code: '165'
  message: column options is invalid
  problem: API input was incorrectly formatted.
  solution: See documentation for correct input formatting.
- code: '166'
  message: The input is not in the required format
  problem: The request input was not specified according to the documentation.
  solution: Check the documentation for the desired endpoint and ensure the request is formatted properly.
- code: '174'
  message: Unknown procedure name.
  problem: The provided procedure name does not exist.
  solution: Check procedure name is spelled correctly or try another procedure name.
- code: '175'
  message: Unknown procedure argument.
  problem: An unsupported argument was included in the procedure arguments.
  solution: Check arguments are spelled correctly or remove unsupported argument.
- code: '176'
  message: Missing required argument.
  problem: The export procedure is missing a requirement argument.
  solution: Include the required argument in your procedure definition.
- code: '177'
  message: Invalid procedure argument.
  problem: An invalid value has been provided for a procedure argument.
  solution: Check the values provided for the procedure arguments are correct.
- code: '178'
  message: The current state of the export does not allow the operation
  problem: The operation is not possible because of the state of the export. Possible reasons are that
    the export is expired or is still running.
  solution: If the export hasn’t completed, wait until the read endpoint indicates that the export is
    complete before retrying the operation.
- code: '180'
  message: One or more of the specified fields are invalid
  problem: One or more of the fields included in a create or update operation aren’t valid for that operation.
  solution: Only include fields that are writable in the operation.
- code: '181'
  message: A required header is missing
  problem: A required HTTP header is missing on the request. For example, if using Salesforce access tokens
    for authentication, the Pardot-Business-Unit-Id header must be included.
  solution: Include the required header.
- code: '182'
  message: Invalid header value
  problem: The value included in an HTTP header isn’t valid. It may be formatted incorrectly.
  solution: Check documentation for the header.
- code: '183'
  message: An internal error occurred, please try your request again
  problem: An internal error occurred.
  solution: Try the request again. The error may have been related to a temporary condition such as a
    request failure between internal Account Engagement or Salesforce systems.
- code: '184'
  message: access_token is invalid, unknown, or malformed
  problem: The access token passed in the Authorization header isn’t usable to make API requests to Account
    Engagement.
  solution: Make sure the access token is formatted correctly and was obtained using a Connected App that
    includes the pardot_api OAuth scope. Make sure the user associated with the token is synced to the
    Account Engagement business unit. Make sure the token used is within its expiration time.
- code: '188'
  message: Provided import origin is invalid
  problem: The import origin specified isn’t valid.
  solution: Use "ui", "api", or "all" for the import origin.
- code: '190'
  message: Email sending is blocked for this account.
  problem: The account has email sending blocked, and an email is being sent.
  solution: Contact support.
- code: '192'
  message: Object specified does not exist
  problem: The object ID specified in the API request doesn’t correspond to an object that exists. The
    object may have been deleted or the object ID passed in may never have been valid.
  solution: Pass in a valid ID for an object that is not deleted or change the request to request a deleted
    object (one that is in the Account Engagement recycle bin). Use the deleted=true parameter in v5.
- code: '193'
- code: '194'
  message: Invalid MIME type.
  problem: The uploaded file isn’t of an allowed type.
  solution: Upload a file of an allowed type. Make sure the extension of the file is appropriate for its
    type.
- code: '197'
  message: Import missing required field
  problem: A required field is missing from your import.
  solution: Include all required field in your import.
- code: '198'
  message: Endpoint not found
  problem: We couldn't find that endpoint ID. Try again.
  solution: Include a valid endpoint.
- code: '199'
  message: Authentication using an api_key is no longer supported. Use Salesforce OAuth access token instead.
    See <https://developer.pardot.com/kb/authentication/> for details.
  problem: The Account Engagement API doesn't support api_key based authentication.
  solution: Salesforce OAuth endpoints should be used to retrieve an access token. See Authentication
    for details
- code: '201'
  message: Business Unit specified in Pardot-Business-Unit-Id header not found or inactive.
  problem: The Business Unit ID is invalid or the business unit isn't active. This error is also returned
    when you use the wrong hostname (pi.pardot.com or pi.demo.pardot.com).
  solution: Make sure that you're using a valid Business Unit ID for an active business unit, and that
    your URL contains the correct hostname.
- code: '202'
  message: Minute rate limit met
  problem: The requested query execution timed out.
  solution: Retry the query with a smaller window or try again later.
- code: '203'
  message: An admin user for the account not found. Ensure a user with the default admin role exists.
  problem: There are no users with the default admin role.
  solution: Make sure there is at least 1 user with the default admin role in Account Engagement.
- code: '204'
  message: File size exceeds the max post size or the body message can't be empty
  problem: The file attached is larger than 50MB or has 0 bytes.
  solution: Make sure the content of the file doesn’t exceed 50MB
- code: '205'
  message: Action name is either missing or incorrect
  problem: The requested object doesn't support the requested record action.
  solution: Check spelling and verify that the record action is available for the requested object.
- code: '206'
  message: Invalid action argument value
  problem: The supplied value for the argument isn’t of the required data type.
  solution: Make sure that the arguments are of the required data type according to the documentation.
    Strings must be enclosed by double quotes (").
- code: '207'
  message: Missing required action argument
  problem: One or more of the required arguments are missing.
  solution: Make sure that you provide all of the required arguments for the requested record action.
- code: '208'
  message: Unknown action argument
  problem: The supplied arguments to the record action are misspelled or invalid.
  solution: Make sure that the arguments are spelled correctly and that they correspond to the arguments
    supported by the record action, according to the documentation.
- code: '209'
  message: 'Too many fields have filters: The max number of 3 distinct fields with filters was exceeded
    for this query.'
  problem: Too many fields in the request have filters. You can add filters to up to 3 fields.
  solution: Decrease the number of fields with filters in the request.
- code: '210'
  message: Page token has expired.
  problem: The page token is expired. Tokens are valid for 4 hours.
  solution: Make sure you aren't using a page token that was issued more than 4 hours ago.
- code: '211'
  message: Page token is invalid.
  problem: The token is null or invalid.
  solution: Make sure the page token sent corresponds to the one provided by the last call's response.
- code: '214'
  message: API request timed out.
  problem: The request timed out.
  solution: Retry the query with smaller limits, offsets, or filter ranges.
- code: '215'
  message: Email form field is required.
  problem: Email form field is required.
  solution: Include an email form field.
- code: '216'
  message: Destination folder is full.
  problem: The target folder for the object is full, and the object can't be created.
  solution: Choose a different folder, or remove assets from the target folder.
- code: '217'
  message: Visitor is invalid.
  problem: The visitor is invalid because `is_identified` is false or null on the visitor record, or `ipAddress`
    is null on the visitor record.
  solution: Check the visitor ID or fix the `is_identified` or `ipAddress` fields on the visitor record.
- code: '218'
  message: 'Feature state is invalid: Connected Campaigns is not enabled for this business unit.'
  problem: Connected Campaigns isn’t enabled for the Account Engagement business unit.
  solution: Enable Connected Campaigns.
- code: '219'
  message: Deleted records can't be updated. Please undelete before updating.
  problem: The record that was targeted for update is in the recycle bin.
  solution: Undelete the record and try again.
- code: '220'
  message: Invalid Available For selection
  problem: 'This email template has false set for all of the following fields and at least one needs to
    be true: isOneToOneEmail, isListEmail, isAutoresponderEmail, isDripEmail.'
  solution: Ensure at least one of isOneToOneEmail, isListEmail, isAutoresponderEmail or isDripEmail is
    true.
- code: '221'
  message: Can’t delete the default template for Engage.
  problem: The request attempted to delete the default Salesforce Engage template.
  solution: Change the default Salesforce Engage template to another template and try again.
- code: '222'
  message: Can’t delete the default template for resubscribe emails
  problem: The request attempted to delete the default resubscribe template.
  solution: Change the default resubscribe template to another template and try again.
- code: '223'
  message: Unable to delete record
  problem: The email template could not be deleted.
  solution: Refer to the message in the response for more details.
- code: '224'
  message: Invalid fields for request type
  problem: The request attempted to query non-queryable fields.
  solution: Remove the invalid fields and try again.
- code: '226'
  message: Mismatched CSV headers and column options
  problem: The CSV import file headers and the column options did not match.
  solution: Update the column options to match the headers of the CSV import file and try again.
- code: '227'
  message: Mismatched CSV headers and field options
  problem: The CSV import file headers and the field options did not match.
  solution: Update the field options to match the headers of the CSV import file and try again.
- code: '228'
  message: The api call doesn't support mixed api versions
  problem: The import was created with a different api version than was used with this request.
  solution: Retrieve status updates for this import using the same api version it was created with.
- code: '231'
  message: Maximum file size has to be at least 10,000,000 bytes
  problem: The maximum file size was set too low.
  solution: Increase the maximum file size to be >= 10,000,000 bytes.
- code: '232'
  message: Maximum file size cannot exceed 200 MB
  problem: The maximum file size cannot exceed your business unit's maximum file size. (Default 200 MB)
  solution: See the error details for your business unit's maximum file size and set maximum file size
    to below the limit.
- code: '233'
  message: There is not a verified Salesforce connector
  problem: There is not a verified Salesforce connector.
  solution: Check your Salesforce connector and ensure it is verified and try again.
- code: '234'
  message: A v2 Salesforce connector is required for this action
  problem: A v2 Salesforce connector is required for this action.
  solution: Update the Salesforce connector to v2 and try again.
- code: '235'
  message: The Salesforce connector is already in the desired state
  problem: The Salesforce connector is already in the requested state.
  solution: The request is redundant so do not repeat it.
- code: '236'
  message: Select a list that is valid for this business unit
  problem: The selected email list does not exist.
  solution: Select a valid email list and try again.
- code: '237'
  message: Incorrect tag replacement language detected
  problem: The tag replacement language was incorrect.
  solution: Select a valid tag replacement language and try again.
- code: '239'
  message: File has been altered after initial download.
  problem: The Engagement Studio export file was altered and cannot be used to recreate the Engagement
    Studio program.
  solution: Export the Engagement Studio program and try again with the new file.
- code: '242'
  message: One or more requested records not found
  problem: There were invalid tag ids present in the request.
  solution: Remove the invalid tag ids and try again.
- code: '243'
  message: The sender address uses a domain that doesn’t exist or isn’t verified in your business unit.
    To send this email, add and verify the sending domain.
  problem: The email address of the sender uses a domain that needs to be set up and/or verified in your
    business unit.
  solution: Add and verify the relevant email sending domain(s) in your business unit. See (<https://help.salesforce.com/s/articleView?id=sf.mcae_email_add_domain.htm&type=5>)
    for details.
- code: '244'
  message: We couldn’t send your email. Review your email and try again.
  problem: There was a temporary connection issue.
  solution: Try again later.
- code: '245'
  message: The supplied name is already in use.
  problem: The supplied name is being used by another record.
  solution: Pick a different record name and try again.
- code: '246'
  message: We couldn’t send your email. Review your email and try again later. Issues with the recipient’s
    email address or service provider can prevent delivery.
  problem: Your email likely has a delivery or content issue. For example, you forgot to add a sender
    address, the recipient’s address is invalid, or required text is missing.
  solution: Review the sender address, recipient address, and required text. Fix any issues and try again.
