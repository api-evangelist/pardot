  solution: Verify that the prospect ID is accurate.
- code: '4'
  message: Invalid prospect email address
  problem: Account Engagement couldn’t find a prospect with the provided email address (for read, update,
    or delete), or the prospect email address is too long (> 255 characters) or has invalid syntax (for
    create/upsert). See Allowed Characters in Email Addresses for email address verification.
  solution: If running create or upsert, verify the email address is valid. If running read, update, or
    delete, verify that a prospect with this email address exists in your Account Engagement instance.
- code: '5'
  message: Invalid query parameters
  problem: Account Engagement didn’t recognize any of the provided search parameters.
  solution: Check parameter spellings. Also, ensure that the specified search parameter is supported by
    the API. See Parameters to Select Prospects for more details.
- code: '6'
  message: Invalid time frame
  problem: The value of the `timeframe` search parameter wasn’t recognized.
  solution: Check for misspellings in the `timeframe` value. Also, verify that the provided value is supported
    by the API. See Parameters to Select Prospects for more for supported `timeframe` values.
- code: '7'
  message: Invalid timestamp
  problem: Account Engagement couldn’t decipher a specified timestamp.
  solution: Verify that the timestamp adheres to GNU standards for date and time input. See GNU Date Input
    Format & Syntax for more information. Also, ensure all characters in the timestamp are URL safe. See
    Parameters to Select Prospects for supported values.
- code: '8'
  message: Invalid time range
  problem: The provided start timestamp is later than the end timestamp.
  solution: Swap the values of the timestamps.
- code: '9'
  message: A prospect with the specified email address already exists
  problem: The provided email address is already assigned to a prospect within Account Engagement. This
