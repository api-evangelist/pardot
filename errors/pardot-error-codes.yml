  message: Invalid API key or user key
  problem: Either the user or API keys are incorrect, or the API key has expired.
  solution: Check the user and API keys in the request. If the user key was entered accurately, then submit
    a request for a new API key.
- code: '2'
  message: Invalid action
  problem: The requested operation wasn’t recognized by the API.
  solution: Verify that the requested operation is valid for the target object type. If that operation
    is allowed, then check for misspellings and other typos.
- code: '3'
  message: Invalid prospect ID
