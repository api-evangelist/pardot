features:
  - name: Lead Scoring and Grading
    description: >-
      Quantitative scoring of prospect engagement combined with qualitative
      grading of fit against an ideal customer profile.
  - name: Engagement Studio
    description: >-
      Visual builder for multi-step, branching nurture programs that respond
      to prospect behavior over time.
  - name: Forms and Landing Pages
    description: >-
      Capture leads via Pardot-hosted forms, form handlers, and landing
      pages that feed Salesforce campaigns.
  - name: Email Marketing
    description: >-
      Send list, automated, and one-to-one emails with dynamic content,
      A/B testing, and engagement metrics.
  - name: Salesforce CRM Integration
    description: >-
      Bi-directional sync with Salesforce Sales Cloud for unified lead and
      opportunity data, campaign influence reporting, and ROI analysis.
  - name: B2B Marketing Analytics
    description: >-
      Pre-built CRM Analytics dashboards for pipeline contribution,
      account engagement, and marketing ROI measurement.
