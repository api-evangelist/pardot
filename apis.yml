aid: pardot
name: Salesforce Marketing Cloud Account Engagement (Pardot)
description: >-
  Salesforce Marketing Cloud Account Engagement, formerly known as Pardot, is
  a B2B marketing automation platform tightly integrated with Salesforce CRM
  for lead generation, lead nurturing, email marketing, and marketing ROI
  reporting. The platform provides campaigns, forms, landing pages, dynamic
  content, lead scoring/grading, and Engagement Studio for multi-step nurture
  programs. Version 5 of the Account Engagement REST API uses Salesforce
  OAuth 2.0 authentication and requires a Business Unit ID header, with hosts
  at pi.pardot.com (production) and pi.demo.pardot.com (sandbox).
type: Index
accessModel:
  pricing: paid
  onboarding: request
  trial: true
  try_now: false
  public: false
  label: Sales-assisted, with published list pricing
  confidence: high
  note: >-
    Salesforce publishes list prices for all four Account Engagement editions
    ($1,250 / $2,750 / $4,400 / $15,000 USD per org per month) but every tier
    ends in a "Contact us" call to action and all per-month products require an
    annual contract. There is no self-serve checkout and no free tier; a free
    trial form is published.
  source:
  - plans/pardot-plans-pricing.yml
  - https://www.salesforce.com/marketing/b2b-automation/pricing/
